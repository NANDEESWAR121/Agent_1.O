<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="url(#paint1_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="url(#paint2_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="paint0_linear" x1="2" y1="2" x2="22" y2="12" gradientUnits="userSpaceOnUse">
              <stop stop-color="#818CF8"/>
              <stop offset="1" stop-color="#C084FC"/>
            </linearGradient>
            <linearGradient id="paint1_linear" x1="2" y1="12" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8"/>
              <stop offset="1" stop-color="#818CF8"/>
            </linearGradient>
            <linearGradient id="paint2_linear" x1="2" y1="7" x2="22" y2="17" gradientUnits="userSpaceOnUse">
              <stop stop-color="#818CF8"/>
              <stop offset="1" stop-color="#38BDF8"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="title">Nanda Antigravity Agent</span>
      </div>
      <span class="free-badge">FREE</span>
    </div>

    <div class="status-box">
      <div class="status-indicator">
        <span id="statusDot" class="dot active"></span>
        <span id="statusText" class="status-label">Status: Running</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div id="clickCount" class="stat-val">0</div>
        <div class="stat-lbl">Actions Taken</div>
      </div>
      <div class="stat-card">
        <div id="lastActionTime" class="stat-val small">None</div>
        <div class="stat-lbl">Last Action</div>
      </div>
    </div>

    <button id="toggleBtn" class="primary-btn btn-active">
      Stop Agent
    </button>

    <div class="footer">
      <a href="#" id="openOptionsBtn" class="options-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        Settings & Target Keywords
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
